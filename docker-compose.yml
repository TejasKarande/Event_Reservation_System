services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketbooking}
      POSTGRES_USER: ${DATABASE_USERNAME:-ticketbooking}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      PORT: ${PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/ticketbooking}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-ticketbooking}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes before starting the application}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: