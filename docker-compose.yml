services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: ticketbooking, POSTGRES_USER: ticketbooking, POSTGRES_PASSWORD: ticketbooking }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ticketbooking"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    environment: { DATABASE_URL: jdbc:postgresql://postgres:5432/ticketbooking, DATABASE_USERNAME: ticketbooking, DATABASE_PASSWORD: ticketbooking, JWT_SECRET: local-development-secret-must-be-at-least-32-bytes }
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
